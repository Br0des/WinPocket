name: WinPocket iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'Documentation/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'Documentation/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winpocket-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # The UTM sources use iOS 27 APIs (scene accessories, dismissalConfirmationDialog),
    # so they need the iOS 27 SDK. Xcode 27 is only on the xcode-27 preview image;
    # macos-26 ships Xcode 26.x, which cannot compile them.
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        id: xcode
        run: |
          xcode_version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake llvm spirv-llvm-translator spirv-tools libxcb libxrandr ldid
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Add Homebrew Bison to PATH
        run: echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Restore QEMU dependency cache
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: sysroot-iOS-arm64
          key: winpocket-qemu-ios-arm64-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('patches/sources', 'scripts/build_dependencies.sh', 'scripts/fixup.sh', 'patches/**/*.patch', 'patches/data/**') }}

      - name: Build iOS QEMU dependencies
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_dependencies.sh -p ios -a arm64
        env:
          NCPU: 3

      - name: Save QEMU dependency cache
        if: success() && steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sysroot-iOS-arm64
          key: winpocket-qemu-ios-arm64-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('patches/sources', 'scripts/build_dependencies.sh', 'scripts/fixup.sh', 'patches/**/*.patch', 'patches/data/**') }}

      - name: Build iOS app
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o build/WinPocket 2>&1 | tee build/ios-build.log

      - name: Publish Xcode errors as annotations
        if: failure()
        run: |
          if [ -f build/ios-build.log ]; then
            errors="$(grep -E 'error:|fatal error:|BUILD FAILED' build/ios-build.log | tail -n 30 || true)"
            if [ -n "$errors" ]; then
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error::$line"
              done <<< "$errors"
            else
              echo "::error::Xcode failed without a compiler error line. See the build step log for the failing command."
            fi
          fi

      - name: Package unsigned IPA
        run: ./scripts/package.sh ipa build/WinPocket.xcarchive build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinPocket-unsigned-IPA
          path: build/ipa/UTM.ipa
          if-no-files-found: error
          retention-days: 14
